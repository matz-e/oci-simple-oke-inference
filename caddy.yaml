---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy-web-server
spec:
  replicas: 3
  selector:
    matchLabels:
      app: caddy
  template:
    metadata:
      labels:
        app: caddy
    spec:
      nodeSelector:
        karpenter.sh/capacity-type: on-demand
      containers:
      - name: caddy
        image: docker.io/library/caddy
        ports:
        - containerPort: 80
        - containerPort: 443
        resources:
          limits:
            cpu: "300m"
          requests:
            cpu: "100m"
            memory: "1.5Gi"

---
apiVersion: v1
kind: Service
metadata:
  name: caddy-loadbalancer
spec:
  type: LoadBalancer
  selector:
    app: caddy
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 80
  - name: https
    protocol: TCP
    port: 443
    targetPort: 443
