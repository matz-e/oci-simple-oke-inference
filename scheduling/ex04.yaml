---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-caddy
spec:
  replicas: 3
  selector:
    matchLabels:
      app: caddy
  template:
    metadata:
      labels:
        app: caddy
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          # whenUnsatisfiable: ScheduleAnyway
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: caddy
      containers:
      - name: caddy
        image: docker.io/library/caddy
        ports:
        - containerPort: 80
        - containerPort: 443
        resources:
          limits:
            cpu: "300m"
          requests:
            cpu: "100m"
            memory: "1.5Gi"
